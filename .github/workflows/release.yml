name: Windows installer
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -q
      - shell: pwsh
        run: ./packaging/build.ps1
      - name: Test packaged backend
        run: python packaging/smoke.py
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 dist/AuditFlow-Setup-0.1.0.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title 'AuditFlow 0.1.0 for Windows' --notes 'Windows x64 installer. Includes Python. Requires Microsoft Edge WebView2 Runtime. Local customer files and databases are not included. Unsigned preview release.' --prerelease
